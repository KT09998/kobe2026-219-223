<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神京阪自由行攻略</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .lucide { display: inline-block; vertical-align: middle; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useRef, useState, useEffect } = React;

        // 輔助組件：渲染圖示
        const LucideIcon = ({ name, className = "w-4 h-4" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons({
                        attrs: { class: className },
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name]);
            return <i ref={iconRef} data-lucide={name}></i>;
        };

        const ItineraryApp = () => {
            const itineraryRef = useRef(null);
            const [isGenerating, setIsGenerating] = useState(false);

            // 你的行程數據
            const itineraryData = {
                title: "神京阪自由行：美食與景點深度版",
                date: "2026.02.19 - 02.23",
                duration: "5天4夜",
                hotel: "Remm Plus 神戶三宮",
                transportInfo: {
                    title: "交通策略：JR 關西迷你鐵路周遊券",
                    usageDays: "Day 2, Day 3, Day 4 (連續3天)",
                    scope: "神戶、京都、大阪、奈良 (JR線)",
                    note: "3天 3,000日圓。Day 4 去奈良搭 JR 往返，搭配「奈良公車一日券」即可解決。"
                },
                days: [
                    {
                        id: 1, dayLabel: "Day 1", date: "02/19 (四)", location: "神戶：香草園與港灣夜景",
                        gourmet: [
                            { name: "老祥記", type: "爆汁豬肉包", tag: "排隊名店", dist: "南京町廣場", desc: "百年老店，神戶唐人街必吃小吃。" },
                            { name: "Grill Ippei", type: "日式洋食", tag: "必比登", dist: "元町站 5分", desc: "必點漢堡排與經典歐姆蛋包飯。" }
                        ],
                        events: [
                            { time: "12:30", title: "抵達神戶機場 (UKB)", desc: "領取行李，搭乘 Port Liner 往三宮站。", icon: "plane" },
                            { time: "15:45", title: "布引香草園纜車", desc: "搭乘約10分鐘的景觀纜車直達山頂。", icon: "mountain", isWarning: true, note: "末班車約 17:15，請注意時間。" }
                        ]
                    },
                    {
                        id: 2, dayLabel: "Day 2", date: "02/20 (五)", location: "京都：清水寺與鐵道之旅",
                        gourmet: [
                            { name: "麵屋 豬一", type: "拉麵", tag: "必比登", dist: "寺町通 2分", desc: "A4黑毛和牛醬油拉麵。" }
                        ],
                        events: [
                            { time: "09:00", title: "移動：JR三宮 → JR京都", desc: "使用 JR Pass，搭乘新快速 (約52分)。", icon: "train" },
                            { time: "14:00", title: "京都鐵道博物館", desc: "展示數十輛實體列車。必衝 SL 蒸氣火車。", icon: "train" }
                        ]
                    }
                    // 基於長度考量，其餘天數可在這裡依樣畫葫蘆加入...
                ],
                checklist: [
                    { label: "JR 關西迷你周遊券", desc: "行動電源" },
                    { label: "ICOCA / 西瓜卡", desc: "護照" }
                ]
            };

            const handleDownloadImage = async () => {
                if (!window.html2canvas) return;
                setIsGenerating(true);
                try {
                    const canvas = await html2canvas(itineraryRef.current, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                    });
                    const link = document.createElement('a');
                    link.download = '神京阪行程.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 0.9);
                    link.click();
                } catch (error) {
                    alert("匯出失敗");
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-100 p-4 md:p-8">
                    <div className="fixed bottom-6 right-6 z-50">
                        <button onClick={handleDownloadImage} disabled={isGenerating} className="bg-blue-600 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 hover:bg-blue-700 transition disabled:opacity-50">
                            <LucideIcon name="download" /> {isGenerating ? "處理中..." : "匯出行程 JPG"}
                        </button>
                    </div>

                    <div ref={itineraryRef} className="max-w-2xl mx-auto bg-white shadow-2xl rounded-xl overflow-hidden">
                        {/* Header */}
                        <div className="bg-slate-50 p-8 text-center border-b">
                            <LucideIcon name="plane" className="w-10 h-10 text-blue-600 mx-auto mb-4" />
                            <h1 className="text-3xl font-bold text-slate-800">{itineraryData.title}</h1>
                            <p className="text-slate-500">{itineraryData.date} • {itineraryData.duration}</p>
                        </div>

                        {/* Transport */}
                        <div className="p-6">
                            <div className="bg-green-50 border-l-4 border-green-400 p-4 rounded-r-lg">
                                <h3 className="flex items-center font-bold text-green-800 mb-1">
                                    <LucideIcon name="train" className="mr-2" /> {itineraryData.transportInfo.title}
                                </h3>
                                <p className="text-sm text-green-700">{itineraryData.transportInfo.note}</p>
                            </div>
                        </div>

                        {/* Days */}
                        <div
